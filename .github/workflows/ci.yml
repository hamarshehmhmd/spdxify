name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[test]" hatchling
      - run: python -m pytest -q
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install . build
      - name: spdxify checks itself
        run: spdxify check pyproject.toml --fail-on info
      - name: example monorepo fails before the fix
        run: "! spdxify check examples/monorepo"
      - name: fix + real isolated builds with latest setuptools/hatchling, warnings are errors
        run: |
          cp -r examples/monorepo /tmp/mono && cd /tmp/mono
          spdxify fix --write || true
          spdxify fix gis --license GPL-3.0-or-later --write
          spdxify check . --ignore PL009
          for p in api cli core gis legacy plugin; do
            python -m build --sdist --wheel "$p" -o /tmp/dist 2>&1 | tee /tmp/log
            if grep -E "License classifiers are deprecated|as a TOML table is deprecated|did not match any files" /tmp/log; then exit 1; fi
          done
          ls /tmp/dist
          unzip -p /tmp/dist/acme_core-*.whl '*/METADATA' | grep -E "^License-(Expression|File)"
